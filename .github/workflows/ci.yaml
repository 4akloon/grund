name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# Every package and the example, on the SDK floor (3.8.0) and on stable.
# Formatting, lints and the publish dry-run use stable only: the formatter's
# output and the lint set change between SDKs, and pub's checks are those of
# the SDK a release is published with.
jobs:
  test:
    name: Test (Dart ${{ matrix.sdk }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sdk: ['3.8.0', stable]
    steps:
      - uses: actions/checkout@v5

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}

      - name: Install dependencies (workspace)
        run: dart pub get

      - name: Verify formatting
        if: matrix.sdk == 'stable'
        run: dart format --output=none --set-exit-if-changed packages example

      - name: Analyze
        if: matrix.sdk == 'stable'
        run: dart analyze --fatal-infos

      - name: Unit tests
        run: |
          # Every directory runs, so one failure does not hide the rest.
          failed=0
          for dir in packages/*/ example/; do
            echo "::group::$dir"
            (cd "$dir" && dart test) || { echo "::error::tests failed in $dir"; failed=1; }
            echo "::endgroup::"
          done
          exit $failed

      - name: Integration tests (dev, build_runner)
        run: |
          (cd packages/grund_cli && dart test integration)
          (cd packages/grund_build && dart test integration)

      - name: Generation benchmark
        run: cd packages/grund_cli && dart test benchmark

  publish-dry-run:
    name: Publish dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies (workspace)
        run: dart pub get

      # Every published package (the list of docs/RELEASING.md); any warning fails the job.
      - name: dart pub publish --dry-run
        run: |
          for package in grund grund_http grund_io grund_shelf \
              grund_generator grund_http_generator grund_cli grund_build; do
            echo "::group::$package"
            (cd "packages/$package" && dart pub publish --dry-run) || exit 1
            echo "::endgroup::"
          done
