name: grund_cli
description: >-
  Command line tool of grund: generates the code of annotated packages
  (gen, gen --watch), runs them with hot reload (dev), compiles the browser
  bundle of client components (bundle) and scaffolds new applications (init).
version: 0.2.0
repository: https://github.com/4akLoon/grund/tree/master/packages/grund_cli
issue_tracker: https://github.com/4akLoon/grund/issues
topics: [cli, codegen, hot-reload, server]
environment:
  sdk: ^3.13.0
resolution: workspace
executables:
  grund: grund_cli
dependencies:
  analyzer: '>=13.3.0 <15.0.0'
  args: ^2.7.0
  grund_generator: ^0.2.0
  grund_http_generator: ^0.2.0
  path: ^1.9.0
  vm_service: ^15.2.0
  watcher: ^1.2.1
  yaml: ^3.1.3
dev_dependencies:
  lints: ^5.1.0
  test: ^1.25.0
