name: grund_build
description: >-
  The build_runner builder of grund: writes X.g.dart next to every library
  with @Module or @Api, byte for byte what grund_cli gen writes.
version: 0.1.0
repository: https://github.com/4akLoon/grund/tree/master/packages/grund_build
issue_tracker: https://github.com/4akLoon/grund/issues
topics: [build-runner, codegen, server]
environment:
  sdk: ^3.8.0
resolution: workspace
dependencies:
  analyzer: '>=8.1.1 <15.0.0'
  build: ^4.0.2
  grund_generator: ^0.1.0
  grund_http_generator: ^0.1.0
  path: ^1.9.0
dev_dependencies:
  build_test: ^3.5.0
  grund_cli: ^0.1.0
  lints: ^5.1.0
  test: ^1.25.0
  yaml: ^3.1.0
