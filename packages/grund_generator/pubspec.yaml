name: grund_generator
description: >-
  Turns grund annotations into ordinary code on the explicit grund API,
  with static validation of the module graph.
version: 0.1.0
repository: https://github.com/4akLoon/grund/tree/master/packages/grund_generator
issue_tracker: https://github.com/4akLoon/grund/issues
topics: [codegen, analyzer, server, framework]
environment:
  sdk: ^3.8.0
resolution: workspace
dependencies:
  analyzer: '>=8.1.1 <15.0.0'
  code_builder: ^4.11.1
  dart_style: ^3.1.2
  path: ^1.9.0
  pub_semver: ^2.1.4
dev_dependencies:
  cases_app: ^0.1.0
  grund: ^0.1.0
  # The fixture packages under test/fixtures import the annotations.
  grund_annotations: ^0.1.0
  grund_http: ^0.1.0
  lints: ^5.1.0
  test: ^1.25.0
  users_app: ^0.1.0
