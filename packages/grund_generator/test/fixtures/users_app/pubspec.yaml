name: users_app
description: >-
  The core e2e users application written with annotations; its generated
  library is the golden file of grund_generator.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.8.0

resolution: workspace

dependencies:
  grund: ^0.1.0
  grund_annotations: ^0.1.0

# The build_runner way of generating lib/users_app.grund.dart; the
# integration test of grund_build checks the golden with it.
dev_dependencies:
  build_runner: '>=2.10.5 <3.0.0'
  grund_build: ^0.1.0
