name: grund_http_generator
description: >-
  The HTTP part of the grund generator: reads @Api classes, their routes,
  parameters, hooks and bodies, and validates them before the application
  starts.
version: 0.1.0
repository: https://github.com/4akLoon/grund/tree/master/packages/grund_http_generator
issue_tracker: https://github.com/4akLoon/grund/issues
topics: [codegen, analyzer, server, http]
environment:
  sdk: ^3.8.0
resolution: workspace
dependencies:
  analyzer: '>=8.1.1 <15.0.0'
  grund_generator: ^0.1.0
dev_dependencies:
  lints: ^5.1.0
  test: ^1.25.0
