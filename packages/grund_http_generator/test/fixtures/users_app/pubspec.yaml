name: users_app
description: >-
  The users application written with annotations; its generated files are
  the golden set of grund_http_generator.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.8.0

resolution: workspace

dependencies:
  grund: ^0.1.0
  grund_http: ^0.2.0

# The build_runner way of generating the golden files; the integration test
# of grund_build checks them with it.
dev_dependencies:
  build_runner: '>=2.10.5 <3.0.0'
  grund_build: ^0.1.0
