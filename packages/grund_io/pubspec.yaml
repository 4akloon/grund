name: grund_io
description: >-
  dart:io HttpServer adapter for grund applications: streaming bodies both
  ways, graceful close with a timeout, HTTPS through a SecurityContext.
version: 0.1.1
repository: https://github.com/4akLoon/grund/tree/master/packages/grund_io
issue_tracker: https://github.com/4akLoon/grund/issues
topics: [server, http, framework]
environment:
  sdk: ^3.13.0
resolution: workspace
dependencies:
  grund: ^0.1.0
  grund_http: ^0.2.0
dev_dependencies:
  grund_conformance: ^0.1.0
  lints: ^5.1.0
  test: ^1.25.0
# A self-signed certificate for the HTTPS test, not a secret.
false_secrets:
  - /test/fixtures/localhost_key.pem
